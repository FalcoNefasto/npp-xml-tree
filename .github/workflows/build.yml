name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            platform: x64
          - name: x86
            platform: Win32
          - name: arm64
            platform: ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config Release

      # Plugin Admin only accepts a zip, with the DLL at the root of the archive.
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/NppXmlTree.dll -DestinationPath "build/NppXmlTree-${{ matrix.name }}.zip"
          Get-FileHash "build/NppXmlTree-${{ matrix.name }}.zip" -Algorithm SHA256 | ForEach-Object {
            "SHA-256 $($_.Hash.ToLower())  NppXmlTree-${{ matrix.name }}.zip"
          } | Write-Host

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: NppXmlTree-${{ matrix.name }}
          path: build/NppXmlTree-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Collect the packages
        uses: actions/download-artifact@v7
        with:
          pattern: NppXmlTree-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
