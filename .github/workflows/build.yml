name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload the DLL
        uses: actions/upload-artifact@v7
        with:
          name: NppXmlTree-x64
          path: build/Release/NppXmlTree.dll
          if-no-files-found: error

      # Plugin Admin only accepts a zip, with the DLL at the root of the archive.
      - name: Package the zip for Plugin Admin
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/NppXmlTree.dll -DestinationPath build/NppXmlTree-x64.zip
          Get-FileHash build/NppXmlTree-x64.zip -Algorithm SHA256 | ForEach-Object {
            "SHA-256 $($_.Hash.ToLower())  NppXmlTree-x64.zip"
          } | Write-Host

      # A tag is a release: the DLL for a manual install, the zip for Plugin Admin.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Release/NppXmlTree.dll
            build/NppXmlTree-x64.zip
          generate_release_notes: true
