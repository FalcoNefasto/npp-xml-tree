name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload the DLL
        uses: actions/upload-artifact@v7
        with:
          name: NppXmlTree-x64
          path: build/Release/NppXmlTree.dll
          if-no-files-found: error

      # A tag is a release: the same DLL, attached to the version.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/Release/NppXmlTree.dll
          generate_release_notes: true
